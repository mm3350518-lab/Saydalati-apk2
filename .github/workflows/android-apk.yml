
name: Build Saydalati APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Check project files
        run: |
          test -f package.json
          test -f index.html

      - name: Install dependencies
        run: npm install

      - name: Prepare Capacitor configuration
        run: |
          if [ ! -f capacitor.config.json ] && \
             [ ! -f capacitor.config.ts ] && \
             [ ! -f capacitor.config.js ]; then
            cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.saydalati.app",
            "appName": "صيدليتي",
            "webDir": "www"
          }
          EOF
          fi

      - name: Build web application
        run: npm run build

      - name: Create Android project if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure AdMob App ID
        env:
          ADMOB_APP_ID: ca-app-pub-8977777779084791~7615099195
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          android_ns = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", android_ns)
          attr_name = f"{{{android_ns}}}name"
          attr_value = f"{{{android_ns}}}value"

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          if not manifest.exists():
              raise SystemExit("AndroidManifest.xml not found")

          tree = ET.parse(manifest)
          root = tree.getroot()
          app = root.find("application")

          if app is None:
              raise SystemExit("application tag not found")

          app_id = os.environ["ADMOB_APP_ID"]
          metadata = None

          for item in app.findall("meta-data"):
              if item.get(attr_name) == \
                  "com.google.android.gms.ads.APPLICATION_ID":
                  metadata = item
                  break

          if metadata is None:
              metadata = ET.SubElement(app, "meta-data")
              metadata.set(
                  attr_name,
                  "com.google.android.gms.ads.APPLICATION_ID"
              )

          metadata.set(attr_value, app_id)
          tree.write(
              manifest,
              encoding="utf-8",
              xml_declaration=True
          )
          print("AdMob App ID configured successfully.")
          PY

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Saydalati-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
